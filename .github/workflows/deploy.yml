# Builds and publishes Reclo to GitHub Pages on every push to main, and once a
# day so "Events this week" stays fresh and past events disappear.
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 12 * * *' # daily, early morning in the Americas
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The Pages URL follows the repository name, so links work if it's renamed.
      RECLO_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium (share images and end-to-end tests)
        run: npx playwright install --with-deps chromium
      - name: Refresh events this week
        run: npm run events
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (validation, ranking, search, events)
        run: npm test
      - name: Build (fails on any invalid or under-evidenced entry)
        run: npm run build
      - name: End-to-end journeys
        run: npx playwright test
        env:
          CI: 'true'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
